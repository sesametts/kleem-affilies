<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commence ici — Kleem Organics × Sesame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2A36DE; --blue-deep:#1B2286; --blue-light:#555EE4; --blue-pale:#F4F5FB;
    --blue-soft:#C5CDF0; --off-white:#FAFAFB;
    --text:#1B1F3B; --text-soft:#3D4263; --gray:#6B7088; --white:#FFFFFF; --border:#E5E7F0;
    --gold:#2A36DE; --green:#1E8E5A; --red:#C62828;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#fff;font-family:'Manrope','Inter',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
  .container{max-width:1080px;margin:0 auto;padding:0 24px;}

  /* TOP BAR */
  .topbar{position:sticky;top:0;z-index:90;background:linear-gradient(90deg,#141C6E 0%,#1B2286 55%,#2B34A8 100%);border-bottom:3px solid var(--gold);box-shadow:0 2px 14px rgba(11,18,64,.22);}
  .topbar-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:10px 24px;flex-wrap:wrap;}
  .topbar-brand{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:'Manrope',sans-serif;}
  .tb-name{color:#fff;font-size:12.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;}
  .tb-x{color:var(--gold);font-size:12px;}
  .topbar-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .nav-item{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid rgba(255,255,255,.34);border-radius:999px;padding:8px 18px;color:#fff;text-decoration:none;cursor:pointer;font-family:'Manrope',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;transition:background .18s,border-color .18s;}
  .nav-item:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.6);}
  .nav-item.active{background:#fff;color:var(--blue-deep);border-color:#fff;}

  /* SECTIONS */
  .sec{padding:34px 0 10px;}
  .sec-label{font-family:'Manrope',sans-serif;font-size:11px;letter-spacing:2.4px;text-transform:uppercase;font-weight:800;color:var(--blue);margin-bottom:8px;}
  .sec-title{font-family:'Manrope',sans-serif;font-size:25px;font-weight:800;color:#0F1863;line-height:1.22;letter-spacing:-.4px;margin:0 0 8px;}
  .sec-intro{font-size:14.5px;color:var(--text-soft);line-height:1.65;margin:0 0 20px;max-width:860px;}

  .hero-banner{
    width:100%;
    background:url('black-friday-kleem.png') center center/contain no-repeat #FBF6F1;
    aspect-ratio: 1672 / 941;
    display:block;
  }
  .sec-title.ed{
    font-family:'Manrope',sans-serif;
    font-size:26px; font-weight:700; color:var(--blue-deep);
    letter-spacing:-.4px; line-height:1.22; margin:0 0 10px;
  }
  .sec .sec-intro{ color:var(--text-soft); }
  @media(max-width:760px){ .sec-title.ed{ font-size:21px; } }
  .gamme{display:grid;grid-template-columns:1fr 1px 1fr;align-items:stretch;margin:4px 0 0;}
  .gamme-col{display:grid;grid-template-columns:250px 1fr;align-items:center;gap:10px;padding:10px 14px;}
  .gamme-img{width:118%;max-width:none;margin-left:-9%;height:auto;display:block;mix-blend-mode:multiply;}
  .gamme-txt{text-align:center;}
  .gamme-rule{width:1px;background:linear-gradient(180deg,transparent,var(--border) 15%,var(--border) 85%,transparent);}
  .gamme-label{font-family:'Manrope',sans-serif;font-size:11px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;color:var(--blue);margin-bottom:12px;}
  .gamme-name{font-family:'Manrope',sans-serif;font-size:26px;font-weight:700;color:var(--blue-deep);line-height:1.2;margin:0 0 16px;letter-spacing:-.4px;}
  .gamme-line{font-family:'Manrope',sans-serif;font-size:14.5px;color:var(--text-soft);line-height:1.6;margin:0 auto 12px;max-width:280px;}
  .gamme-line:last-child{margin-bottom:0;}
  .gamme-mini{grid-template-columns:1fr;border-top:1px solid var(--border);margin-top:14px;padding-top:14px;}
  .gamme-mini .gamme-col{max-width:560px;margin:0 auto;}
  .gamme-mini .gamme-line{max-width:330px;}
  .gamme3{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;align-items:start;margin:6px 0 4px;}
  .g3-col{text-align:center;}
  .g3-img{width:100%;max-width:200px;height:230px;object-fit:contain;display:block;margin:0 auto 16px;}
  .g3-col .gamme-name{font-size:21px;margin-bottom:12px;}
  .g3-col .gamme-line{max-width:250px;font-size:14px;}
  @media(max-width:760px){ .gamme3{grid-template-columns:1fr;gap:30px;} .g3-img{max-width:180px;} }
  .gamme-foot{margin:44px 0 30px;text-align:center;}
  .gamme-claim{font-family:'Manrope',sans-serif;font-size:18px;font-weight:600;color:var(--blue-deep);margin:0;line-height:1.5;}
  .gamme-claim b{color:#B08968;font-weight:500;}
  @media(max-width:760px){
    .gamme{grid-template-columns:1fr;}
    .gamme-rule{width:100%;height:1px;background:linear-gradient(90deg,transparent,#D9BFA8,transparent);margin:18px 0;}
    .gamme-col{grid-template-columns:1fr;padding:4px;gap:4px;justify-items:center;}
    .gamme-img{width:76%;max-width:260px;margin-left:0;}
    .gamme-name{font-size:25px;}
    .gamme-claim{font-size:16px;}
  }
  .lark{background:var(--blue-deep);border-radius:18px;padding:40px 44px;color:#fff;margin-top:4px;}
  .lark-title{font-family:'Manrope',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.4px;margin:0 0 10px;color:#fff;}
  .lark-intro{font-family:'Manrope',sans-serif;font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.80);margin:0 0 16px;}
  .lark-list{margin:0 0 24px;padding-left:20px;font-family:'Manrope',sans-serif;font-size:14.5px;line-height:1.85;color:rgba(255,255,255,.88);}
  .lark-list strong{color:#fff;font-weight:800;}
  .lark-cta{display:inline-flex;align-items:center;background:#fff;color:var(--blue-deep);text-decoration:none;font-family:'Manrope',sans-serif;font-size:12.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;padding:13px 26px;border-radius:999px;transition:transform .18s;}
  .lark-cta:hover{transform:translateY(-1px);}
  .lark-note{font-family:'Manrope',sans-serif;font-size:12.5px;color:rgba(255,255,255,.62);margin:14px 0 0;}
  @media(max-width:620px){ .lark{padding:26px 22px;} .lark-title{font-size:20px;} }
  .dd-txt{font-family:'Manrope',sans-serif;font-size:13px;color:var(--text-soft);line-height:1.55;margin:0 0 12px;min-height:40px;}
  .dd-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px 40px;margin-top:6px;align-items:start;}
  .dd-row-title{font-family:'Manrope',sans-serif;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--blue-deep);margin-bottom:10px;}
  .dd-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .dd-fig{margin:0;border-radius:11px;overflow:hidden;border:2px solid var(--border);background:#fff;}
  .dd-fig img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover;}
  .dd-fig figcaption{font-family:'Manrope',sans-serif;font-size:11.5px;font-weight:600;line-height:1.4;padding:9px 10px;display:flex;align-items:flex-start;gap:6px;min-height:46px;}
  .dd-fig.ok{border-color:#BFE3CF;}
  .dd-fig.ok figcaption{background:#F0F9F4;color:#15663F;}
  .dd-fig.ko{border-color:#F3C9C9;}
  .dd-fig.ko figcaption{background:#FDF2F2;color:#A32020;}
  .dd-fig.neutral figcaption{background:var(--blue-pale);color:var(--blue-deep);}
  .tick{font-weight:800;color:#1E8E5A;}
  .cross{font-weight:800;color:#C62828;}
  .dd-row.astuce{}
  @media(max-width:820px){ .dd-grid{grid-template-columns:1fr;} }

  .banner-note{font-family:'Manrope',sans-serif;font-size:13px;color:var(--text-soft);line-height:1.6;
    margin:14px 0 0;max-width:860px;}
  .banner-star{color:var(--blue);font-weight:800;margin-right:4px;}

  /* flèche pulsante entre sections */
  .sec-arrow{display:flex;justify-content:center;margin:26px 0 4px;}
  .sec-arrow span{display:inline-block;color:var(--blue);font-size:26px;line-height:1;animation:bob 1.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.55;}50%{transform:translateY(7px);opacity:1;}}

  /* bouton Lark pulsant + QR */
  .lark-grid{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:center;}
  .lark-grid .lark-txt{justify-self:stretch;}
  .lark-qr-col{width:100%;text-align:left;align-self:center;display:flex;flex-direction:column;align-items:flex-start;}
  .lark-qr{background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;width:200px;height:200px;max-width:100%;padding:14px;margin:0;}
  @media(max-width:960px){ .lark-grid{grid-template-columns:1fr;} .lark-qr-col{justify-self:center;} .lark-qr{width:280px;height:280px;} }
  .lark-join{display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin-top:6px;}
  .lark-cta{animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.55);}50%{box-shadow:0 0 0 14px rgba(255,255,255,0);}}
  .lark-qr img{width:100%;height:100%;object-fit:contain;display:block;}
  .lark-qr-cap{font-family:'Manrope',sans-serif;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;
    color:rgba(255,255,255,.72);margin-top:12px;text-align:center;width:200px;}
  @media(max-width:620px){ .lark-join{justify-content:center;} }
  .eyebrow{display:flex;align-items:center;gap:14px;margin:40px 0 16px;}
  .eyebrow-num{font-family:'Manrope',sans-serif;font-size:26px;font-weight:800;letter-spacing:0;color:var(--blue);line-height:1;}
  .eyebrow-rule{width:52px;height:1px;background:var(--border);}
  .eyebrow-txt{font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;letter-spacing:2.6px;text-transform:uppercase;color:var(--text-soft);}
  .hero-banner{margin-bottom:6px;}
  .camp-img{width:100%;display:block;border-radius:18px;border:1px solid var(--border);margin-bottom:16px;box-shadow:0 6px 22px rgba(27,34,134,.08);}
  .card{background:#fff;border:1px solid var(--blue-soft);border-radius:18px;padding:26px 28px;box-shadow:0 6px 22px rgba(27,34,134,.08);}

  /* CAMPAGNE */
  .camp{background:linear-gradient(135deg,#FFFBF0 0%,#FFF4DC 100%);border:2px solid var(--gold);}
  .camp-badge{display:inline-block;background:linear-gradient(135deg,#B58F19,#D4A939);color:#3A2705;padding:5px 13px;border-radius:999px;font-family:'Manrope',sans-serif;font-size:10.5px;letter-spacing:2px;font-weight:800;text-transform:uppercase;margin-bottom:12px;}
  .camp h2{font-family:'Manrope',sans-serif;font-size:23px;font-weight:800;color:#5C3E07;margin:0 0 6px;line-height:1.25;}
  .camp p{font-size:14px;color:#7A5A0A;line-height:1.6;margin:0 0 18px;}
  .offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;}
  .offer{background:#fff;border:1px solid var(--gold);border-radius:12px;padding:16px 18px;}
  .offer-buy{font-family:'Manrope',sans-serif;font-size:14px;font-weight:800;color:#5C3E07;margin-bottom:5px;line-height:1.35;}
  .offer-get{font-size:13.5px;color:#7A5A0A;line-height:1.45;}
  .offer-get b{color:#B58F19;font-weight:800;}

  /* COMPARATIF */
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .prod{border:1px solid var(--blue-soft);border-radius:14px;padding:20px 22px;background:var(--off-white);}
  .prod.adv{background:#EEF0FA;border-color:var(--blue);}
  .prod-tag{font-family:'Manrope',sans-serif;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;font-weight:800;color:var(--blue);margin-bottom:6px;}
  .prod h3{font-family:'Manrope',sans-serif;font-size:18px;font-weight:800;color:#0F1863;margin:0 0 10px;}
  .prod ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.75;color:var(--text);}
  .seq{background:#EEF0FA;border-left:3px solid var(--blue-deep);border-radius:8px;padding:16px 20px;font-size:13.5px;line-height:1.7;color:var(--text);}

  /* VIDEOS */
  .vids{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:620px;}
  .vid{border:1px solid var(--blue-soft);border-radius:12px;overflow:hidden;background:#000;}
  .vid video{width:100%;display:block;aspect-ratio:9/16;object-fit:cover;background:#000;}

  /* DO / DONT */
  .dd{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .dd-col{border-radius:14px;padding:20px 22px;}
  .dd-do{background:#F0F9F4;border:1px solid #BFE3CF;}
  .dd-dont{background:#FDF2F2;border:1px solid #F3C9C9;}
  .dd-head{font-family:'Manrope',sans-serif;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;margin-bottom:12px;}
  .dd-do .dd-head{color:var(--green);}
  .dd-dont .dd-head{color:var(--red);}
  .dd-col ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.8;color:var(--text);}

  footer{text-align:center;padding:36px 20px 44px;color:var(--text-soft);font-size:12.5px;}

  @media(max-width:760px){
    .topbar-inner{justify-content:center;padding:10px 14px;}
    .compare,.dd{grid-template-columns:1fr;}
    .vids{max-width:100%;gap:8px;}
    .sec-title{font-size:21px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="topbar-brand" href="index.html">
      <span class="tb-name">Kleem Organics</span>
      <span class="tb-x">×</span>
      <span class="tb-name">Sesame</span>
    </a>
    <nav class="topbar-nav">
      <a class="nav-item active" href="commence-ici.html">Commence ici</a>
      <a class="nav-item" href="index.html#les-contenus">Les meilleurs conseils</a>
      <a class="nav-item" href="index.html#bibliotheque">Plus inspiration</a>
    </nav>
  </div>
</header>

  <div class="container">
    <div class="eyebrow"><span class="eyebrow-num">01</span><span class="eyebrow-rule"></span><span class="eyebrow-txt">L'offre du moment</span></div>
  </div>
<section class="hero-banner" aria-label="Black Friday Kleem Organics : 1 pot 28 €, 2 pots 50 €, 3 pots 65 € — concours affiliés, du 11/11 au 16/12"></section>

<div class="container" style="height:40px"></div>

</body>
</html>
